server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 10m;

    # Correlation header forwarded to every microservice
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    location /api/auth {
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }

    location /api/courts {
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/pricing-rules {
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/bookings {
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/payments {
        set $payment_upstream http://payment-service:8003;
        proxy_pass $payment_upstream;
    }

    location /api/checkin {
        set $checkin_upstream http://checkin-qr-service:8004;
        proxy_pass $checkin_upstream;
    }

    location /api/notifications {
        set $notification_upstream http://notification-service:8005;
        proxy_pass $notification_upstream;
    }

    location / {
        set $frontend_upstream http://web-frontend:80;
        proxy_pass $frontend_upstream;
    }
}
