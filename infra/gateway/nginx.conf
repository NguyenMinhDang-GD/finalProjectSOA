server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # Correlation header forwarded to every microservice
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    location /api/auth {
        proxy_pass http://auth-service:8001;
    }

    location /api/courts {
        proxy_pass http://court-booking-service:8002;
    }

    location /api/pricing-rules {
        proxy_pass http://court-booking-service:8002;
    }

    location /api/bookings {
        proxy_pass http://court-booking-service:8002;
    }

    location /api/payments {
        proxy_pass http://payment-service:8003;
    }

    location /api/checkin {
        proxy_pass http://checkin-qr-service:8004;
    }

    location /api/notifications {
        proxy_pass http://notification-service:8005;
    }

    location / {
        proxy_pass http://web-frontend:80;
    }
}
