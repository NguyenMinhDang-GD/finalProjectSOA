limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=15r/m;
limit_req_zone $binary_remote_addr zone=write_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=read_limit:10m rate=120r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=5s ipv6=off;
    client_max_body_size 10m;

    # Baseline browser security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Correlation header forwarded to every microservice (trusted remote_addr)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location = /gateway-health {
        default_type application/json;
        return 200 '{"status":"ok","gateway":"nginx"}';
    }

    # Block internal service endpoints at the public gateway
    location ~ ^/api/.*/internal/ {
        default_type application/json;
        return 403 '{"detail":"Internal endpoint is not publicly accessible"}';
    }

    location = /api/auth/login {
        limit_req zone=auth_limit burst=10 nodelay;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }

    location = /api/auth/register {
        limit_req zone=auth_limit burst=10 nodelay;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }

    location /api/auth {
        limit_req zone=read_limit burst=30 nodelay;
        set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream;
    }

    location /api/branches {
        limit_req zone=read_limit burst=40 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/locations {
        limit_req zone=read_limit burst=40 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/courts {
        limit_req zone=read_limit burst=40 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/pricing-rules {
        limit_req zone=read_limit burst=40 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location = /api/bookings {
        limit_req zone=write_limit burst=20 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location /api/bookings {
        limit_req zone=read_limit burst=40 nodelay;
        set $booking_upstream http://court-booking-service:8002;
        proxy_pass $booking_upstream;
    }

    location = /api/payments/create {
        limit_req zone=write_limit burst=20 nodelay;
        set $payment_upstream http://payment-service:8003;
        proxy_pass $payment_upstream;
    }

    location /api/payments {
        limit_req zone=read_limit burst=40 nodelay;
        set $payment_upstream http://payment-service:8003;
        proxy_pass $payment_upstream;
    }

    location /api/checkin {
        limit_req zone=read_limit burst=40 nodelay;
        set $checkin_upstream http://checkin-qr-service:8004;
        proxy_pass $checkin_upstream;
    }

    location /api/notifications {
        limit_req zone=read_limit burst=30 nodelay;
        set $notification_upstream http://notification-service:8005;
        proxy_pass $notification_upstream;
    }

    location / {
        set $frontend_upstream http://web-frontend:80;
        proxy_pass $frontend_upstream;
    }
}
